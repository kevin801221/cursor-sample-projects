# Aquarium R1：只動一個變因——模型 n → s（其餘與 R0 相同）
roboflow:
  workspace: brad-dwyer
  project: aquarium-combined
  version: 6
  format: yolov8
  api_key_env: ROBOFLOW_API_KEY

paths:
  raw: data/raw/aquarium
  processed: data/processed/aquarium
  runs: runs

dataset:
  split: [0.7, 0.2, 0.1]
  seed: 42

train:
  model: yolov8s.pt
  name: aq-s-640
  epochs: 60
  batch: 16
  imgsz: 640
  device: auto

optimize:
  iterations: 8
  epochs: 10

infer:
  conf: 0.25
  num_samples: 10
