[project]
name = "dashboard"
version = "0.1.0"
description = "營運數據儀表板：pandas 清理管線 + Streamlit 多頁互動儀表板"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=30.0",
    "streamlit>=1.40",
    "plotly>=5.24",
    "openpyxl>=3.1",
    "loguru>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["."]
