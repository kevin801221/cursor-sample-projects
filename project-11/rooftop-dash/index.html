<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooftop Dash · 屋頂衝刺</title>
    <!-- 內嵌 favicon：不連外、也不會在 console 留下 404（示範沉默故障時 console 要全綠） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101a2b'/%3E%3Crect x='6' y='20' width='20' height='4' fill='%2394a3b8'/%3E%3Crect x='12' y='8' width='8' height='10' rx='3' fill='%234ade80'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #game canvas {
        border-radius: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
      #tips {
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tips">← → 移動　SPACE 跳躍　P 暫停　R 重來　M 主選單</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
