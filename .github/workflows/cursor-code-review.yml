name: "Cursor AI Automated Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Fetch PR Git Diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          else
            git diff HEAD~1 > pr_diff.txt || echo "No diff" > pr_diff.txt
          fi
          echo "DIFF_LINES=$(wc -l < pr_diff.txt)" >> $GITHUB_ENV

      - name: Run Cursor Headless Review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -s pr_diff.txt ]; then
            DIFF_CONTENT=$(cat pr_diff.txt)
          else
            DIFF_CONTENT="無重大差異，請快速掃描專案代碼健康度。"
          fi
          
          cursor -p "請依據繁體中文審查以下 PR Git Diff。重點檢查：1. 是否有 SQL Injection / XSS 等資安漏洞 2. 是否缺少錯誤處理 3. 是否有記憶體洩漏風險。若發現重大問題，請以 [CRITICAL] 標記：$DIFF_CONTENT" \
            --force \
            --output-format text > review_report.md

      - name: Post Comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('review_report.md')) {
              const review = fs.readFileSync('review_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 Cursor AI Code Review 審查結果\n\n${review}`
              });
            }
