[project]
name = "rag-chatbot"
version = "0.1.0"
description = "RAG-based company knowledge base chatbot（查完再答，回答一定附出處）"
requires-python = ">=3.10"

dependencies = [
    # 注意：langchain 1.0 拿掉了 ConversationalRetrievalChain 與 ConversationBufferMemory，
    # 本課教材整堂都建立在這兩個類別上，所以鎖在 0.3.x。
    "langchain>=0.3.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langchain-chroma>=0.1.4,<1.0",
    "chromadb>=0.5.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "pypdf>=3.17.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    # 用來把 data/員工手冊.md 產生成有頁碼的示範 PDF（內建 CJK 字型，不用下載字型檔）
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
